name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        run: npm install --global pnpm@10.4.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build client
        run: pnpm exec vite build

      # Vite already adds /jaye-watts-website/ to compiled JS and CSS paths.
      # Public files under /assets/ are the exception, so only rewrite a root
      # /assets/ reference when it is not already prefixed by the GitHub Pages path.
      - name: Fix public asset paths for GitHub Pages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("dist/public")
          prefix = "/jaye-watts-website/assets/"
          pattern = re.compile(r'(?<!/jaye-watts-website)/assets/')

          for path in root.rglob("*"):
              if path.is_file() and path.suffix in {".html", ".js", ".css"}:
                  text = path.read_text(encoding="utf-8")
                  text = pattern.sub(prefix, text)
                  path.write_text(text, encoding="utf-8")
          PY

      - name: Add SPA fallback
        run: cp dist/public/index.html dist/public/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
